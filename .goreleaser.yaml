version: 2

project_name: gridctl

before:
  hooks:
    # Build frontend before Go compilation
    - npm ci --prefix web
    - npm run build --prefix web
    - rm -rf cmd/gridctl/web/dist
    - mkdir -p cmd/gridctl/web
    - cp -r web/dist cmd/gridctl/web/

builds:
  - id: gridctl
    main: ./cmd/gridctl
    binary: gridctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -tags=embed_web
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    # name_template is consumed by scripts/install.sh and cmd/gridctl/upgrade.go
    # to construct download URLs. Changing it without updating both will break
    # the curl installer and the `gridctl upgrade` subcommand.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  # checksums.txt is consumed by scripts/install.sh and cmd/gridctl/upgrade.go
  # for SHA256 verification. Changing this filename will break checksum lookup
  # in both consumers.
  name_template: "checksums.txt"

sboms:
  - id: go-artifacts
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: frontend-build
    artifacts: any
    documents:
      - frontend-build.spdx.json
    cmd: sh
    args:
      - -c
      - npm sbom --prefix ../web --sbom-format=spdx --include=dev --legacy-peer-deps > "$document"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^ci:"
      - "^build:"
  groups:
    - title: Breaking Changes
      regexp: '^.*!:'
      order: 0
    - title: Features
      regexp: "^feat"
      order: 1
    - title: Bug Fixes
      regexp: "^fix"
      order: 2
    - title: Performance
      regexp: "^perf"
      order: 3
    - title: Refactoring
      regexp: "^refactor"
      order: 4
    - title: Others
      order: 999

release:
  github:
    owner: gridctl
    name: gridctl
  draft: true
  prerelease: auto
  name_template: "{{.Tag}}"
  header: |
    ## What's New in {{ .Tag }}

    See the [CHANGELOG](https://github.com/gridctl/gridctl/blob/main/CHANGELOG.md) for full release history.

    ---
  footer: |
    ---
    ## Installation

    **Quick install (macOS / Linux / WSL2)**:
    ```bash
    curl -fsSL https://raw.githubusercontent.com/gridctl/gridctl/main/install.sh | sh
    ```

    **Homebrew**:
    ```bash
    brew install gridctl/tap/gridctl
    ```

    **Binary Download**: See assets below for your platform.

    **Authenticate before installation**: Follow the [release verification procedure](https://github.com/gridctl/gridctl/blob/{{ .Tag }}/docs/release-verification.md) with the archive and `provenance.sigstore.json`. Check the expected full source SHA independently. The installer and updater verify checksums, not attestations.

    **Full Changelog**: https://github.com/gridctl/gridctl/compare/{{ .PreviousTag }}...{{ .Tag }}

homebrew_casks:
  - name: gridctl
    # The release workflow advances the generated cask only after public checks.
    skip_upload: true
    repository:
      owner: gridctl
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/gridctl/gridctl"
    description: "MCP orchestration tool - Containerlab for AI Agents"
    binaries:
      - gridctl
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/gridctl"]
