# Per-tool policy example
#
# Two layers, used for different jobs:
#
# - A server `tools:` whitelist hides a tool and rejects it as unknown.
# - A `policy:` block blocks a listed tool with a named rule. The block
#   survives a later expose-all edit in the Tools workspace, so putting
#   the tool back on the whitelist does not make it callable.
#
# This server has no `tools:` whitelist on purpose. With `tools: [list_paths]`,
# `vault__read_secret` is rejected as unknown before the policy gate runs,
# and the verification commands would never show a policy denial.
#
# The alpine image does not speak MCP. It exists so `gridctl validate` and
# `task examples:refs` pass. Substitute a real Vault MCP image before
# running the commands in the README.
#
# Usage:
#   gridctl apply examples/access-control/read-only-secrets.yaml
#
version: "1"
name: read-only-secrets

network:
  name: read-only-secrets-net

mcp-servers:
  - name: vault
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    port: 8080
    command: ["sh", "-c", "while true; do sleep 3600; done"]

policy:
  default: allow
  rules:
    - match: "vault__*"
      action: block
    - match: "vault__list_paths"
      action: allow
