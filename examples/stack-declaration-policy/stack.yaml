# Example candidate for offline declaration-policy checks.
#
# This stack is a declaration fixture, not a runtime demo. Policy evaluation
# does not deploy it, open the image, or authorize later apply.
#
# Usage:
#   gridctl validate examples/stack-declaration-policy/stack.yaml \
#     --policy examples/stack-declaration-policy/policy.yaml
version: "1"
name: declaration-policy-demo

gateway:
  security:
    schema_pinning:
      enabled: true
      action: block

mcp-servers:
  - name: tools-server
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    port: 8080
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    tools: ["read", "list"]

resources:
  - name: cache
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
