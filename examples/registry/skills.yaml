# Skill Sources Example
#
# Place this at ~/.gridctl/skills.yaml. The Library source list reads it
# for auto-update display. gridctl skill update does not consult it, and
# an auth: block in this file is not resolved on fetch.
# Persist credentials at import instead:
#
#   gridctl skill add <repo> --vault-key GIT_TOKEN
#   gridctl skill add <ssh-url> --ssh-key ~/.ssh/id_ed25519
#   gridctl skill update
#
# See docs/config-schema.md ("Skill Sources") for the full field reference.
#
# Security:
#   - Raw PATs and SSH keys MUST NOT appear in this file.
#   - A --vault-key reference or an absolute --ssh-key path is written at
#     import and reused later. Literal and piped tokens persist nothing.

defaults:
  auto_update: true
  update_interval: 24h

sources:
  # Public repo — no auth needed.
  - name: public-skills
    repo: https://github.com/acme/public-skills
    ref: main

  # Schema example only. This auth block is not read on update.
  # Import with: gridctl skill add <repo> --vault-key GIT_TOKEN
  - name: private-skills
    repo: https://github.com/acme/private-skills
    ref: v1.2.0
    auth:
      method: token
      credential_ref: "${var:GIT_TOKEN}"

  # Schema example only. This auth block is not read on update.
  # Import with: gridctl skill add <ssh-url> --ssh-key ~/.ssh/id_ed25519
  - name: private-ssh-skills
    repo: git@github.com:acme/private-skills.git
    auth:
      method: ssh-agent
