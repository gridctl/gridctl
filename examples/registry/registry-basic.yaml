# Registry Basic Example
#
# Demonstrates Agent Skills with a single MCP server. The registry stores
# reusable skills as SKILL.md files in ~/.gridctl/registry/skills/{name}/.
# Skills are not declared in stack YAML. Local directory import is
# Unreleased. Import this draft before apply so the gateway loads it,
# then activate it through that gateway:
#
#   gridctl skill add examples/registry/items/code-review --no-activate
#   gridctl activate code-review
#
# Prerequisites:
#   Run `task mock:servers` from the project root to build the mock server.
#
# Usage:
#   gridctl skill add examples/registry/items/code-review --no-activate
#   gridctl apply examples/registry/registry-basic.yaml
#   gridctl activate code-review

version: "1"
name: registry-basic

network:
  name: registry-basic-net
  driver: bridge

mcp-servers:

  # Local process MCP server (stdio transport, no Docker required)
  # Provides: echo, add, get_time tools
  - name: local-tools
    command: ["../_mock-servers/local-stdio-server/mock-stdio-server"]
