# Skills Registry Stack
#
# Demonstrates the skills registry alongside MCP servers.
# Skills defined in ~/.gridctl/registry/skills/ are exposed as MCP prompts.
#
# Usage:
#   gridctl apply examples/getting-started/skills-basic.yaml
#   gridctl skill list
#   gridctl activate my-skill

version: "1"
name: skills-demo

network:
  name: skills-demo-net

mcp-servers:
  # Tools server for skill workflows to call
  - name: tools-server
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    port: 8080
    command: ["sh", "-c", "while true; do sleep 3600; done"]
