# Expected-failures baseline for @modelcontextprotocol/conformance
# 0.2.0-alpha.12, scored with --requirements 2026-07-28 against a
# stackless gridctl daemon on /mcp. The 2025-11-25 run and the fleet
# surfaces have their own files: with --expected-failures the suite is
# strict (warnings count as failures) and a listed pass is stale.
#
# An entry is one line. A per-check entry is `<scenario>:<check-id>` with
# no space after the colon. `- tools-list: wire-schema-valid` is a YAML
# mapping and is rejected; `- tools-list:wire-schema-valid` is the check
# id. A wholesale scenario name excuses every check in that scenario.
# Use a per-check entry when only one check fails.
#
# A failure listed here is expected (exit 0). A failure not listed is a
# regression (exit 1). A pass for a listed entry is a stale baseline
# (exit 1). An entry whose scenario does not run is neither. not_scored
# scenarios are outside this file: the requirements run ignores them, and
# the three pending ones have conformance-baseline-2026-07-28-pending.yml.
#
# Almost every entry fails by design. The suite calls its own diagnostic
# tools, resources, and prompts. A stackless gateway has no fleet, so
# those calls cannot succeed. Sampling, elicitation, and subscriptions
# need server-initiated requests, which gridctl does not relay.
server:
  # discover says prompts are unimplemented; prompts/list still answers
  # an empty array, which the suite reads as "handles prompts".
  - server-stateless:sep-2575-server-declares-prompts-in-discover # empty registry does not advertise prompts
  - server-stateless:sep-2575-server-rejects-undeclared-capability # suite tool test_missing_capability is not implemented
  - server-stateless:sep-2575-missing-capability-http-400 # suite tool test_missing_capability is not implemented
  - server-stateless:sep-2575-http-server-no-independent-requests-on-stream # suite tool test_streaming_elicitation is not implemented
  - server-stateless:sep-2575-server-no-log-without-loglevel # suite tool test_logging_tool is not implemented
  - server-stateless:sep-2575-server-sends-tools-list-changed-on-subscription # suite mutates tools the gateway does not host, so no list change is emitted
  - completion-complete:completion-complete # completion/complete is not implemented
  - tools-call-simple-text:tools-call-simple-text # suite tool test_simple_text is not implemented
  - tools-call-image:tools-call-image # suite tool test_image_content is not implemented
  - tools-call-audio:tools-call-audio # suite tool test_audio_content is not implemented
  - tools-call-embedded-resource:tools-call-embedded-resource # suite tool test_embedded_resource is not implemented
  - tools-call-mixed-content:tools-call-mixed-content # suite tool test_multiple_content_types is not implemented
  - tools-call-error:tools-call-error # suite tool test_error_handling is not implemented
  - tools-call-with-progress:tools-call-with-progress # suite tool test_tool_with_progress is not implemented
  - resources-read-text:resources-read-text # suite resource test://static-text is not implemented
  - resources-read-binary:resources-read-binary # suite resource test://static-binary is not implemented
  - resources-templates-read:resources-templates-read # suite template test://template/123/data is not implemented
  - prompts-get-simple:prompts-get-simple # no registry skill and no suite prompt
  - prompts-get-with-args:prompts-get-with-args # no registry skill and no suite prompt
  - prompts-get-embedded-resource:prompts-get-embedded-resource # no registry skill and no suite prompt
  - prompts-get-with-image:prompts-get-with-image # no registry skill and no suite prompt
  - input-required-result-basic-elicitation:sep-2322-elicitation-incomplete # suite tool test_input_required_result_elicitation is not implemented
  - input-required-result-basic-sampling:sep-2322-sampling-incomplete # suite tool test_input_required_result_sampling is not implemented
  - input-required-result-basic-list-roots:sep-2322-list-roots-incomplete # suite tool test_input_required_result_list_roots is not implemented
  - input-required-result-request-state:sep-2322-request-state-incomplete # suite tool test_input_required_result_request_state is not implemented
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete # suite tool test_input_required_result_multiple_inputs is not implemented
  - input-required-result-multi-round:sep-2322-multi-round-r1 # suite multi-round input tool is not implemented
  - input-required-result-missing-input-response:sep-2322-missing-response-rerequests # unknown suite tool returns -32602 instead of re-requesting
  - input-required-result-non-tool-request:sep-2322-non-tool-incomplete # no registry, so the non-tool probe cannot start
  - input-required-result-result-type:sep-2322-result-type-included # suite tool test_input_required_result_elicitation is not implemented
  - input-required-result-tampered-state:sep-2322-reject-tampered-state # prerequisite suite tool is not implemented
  - input-required-result-capability-check:sep-2322-respect-client-capabilities # suite tool test_input_required_result_capabilities is not implemented
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params # unknown suite tool is a protocol error, not an ignored extra param
