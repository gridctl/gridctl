# Dependabot version updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: chore commits are excluded from CHANGELOG generation (cliff.toml).
# This is intentional — dependency bump PRs do not appear in release notes.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      rjsf:
        patterns:
          - "@rjsf/*"
      # react-dom pins its peer react to the exact same version, so a solo
      # bump of either one fails npm ci with an unresolvable peer conflict
      # (see the react-dom 19.2.8 bump). Group them so they move in lockstep.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
