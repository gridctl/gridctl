name: Tap authentication diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'gridctl/gridctl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install reviewed GitHub CLI
        run: |
          python3 scripts/release-tools.py "$RUNNER_TEMP/tap-diagnostic-tools" gh
          printf '%s\n' "$RUNNER_TEMP/tap-diagnostic-tools" >> "$GITHUB_PATH"
      - name: Compare read-only tap authentication
        env:
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/tap-auth-diagnostic.py
