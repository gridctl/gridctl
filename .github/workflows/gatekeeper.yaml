name: Gatekeeper

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Go dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=3m

      - name: Go tests with coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 64" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 64% threshold"
            exit 1
          fi

      - name: Per-package coverage thresholds
        run: bash scripts/check-coverage.sh

      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          bash scripts/govulncheck.sh

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build Go binary
        run: task build:go

      - name: Validate example stacks
        run: |
          # Add example stack YAML files under examples/ to have them validated here.
          # Exit codes: 0=valid, 1=errors (fail), 2=warnings only (pass)
          # skills.yaml is a skill-source list and gridctl-pack.yaml a pack
          # manifest (different schemas) — neither is a stack.
          #
          # gateway-remote.yaml is excluded because it is the one example that
          # requires a secret: a non-loopback bind refuses to start without
          # gateway.auth.token, and the variable it references cannot exist in
          # CI, so validation reads the unset value as a missing required
          # field. Giving it a default would ship a working credential in a
          # public repo, which is worse than not validating the file.
          mapfile -t files < <(find examples -name "*.yaml" -not -name "skills.yaml" -not -name "gridctl-pack.yaml" -not -name "gateway-remote.yaml" | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example stacks found, skipping validation"
            exit 0
          fi
          failed=0
          for f in "${files[@]}"; do
            echo "Validating $f..."
            ./gridctl validate "$f" && rc=0 || rc=$?
            if [ $rc -eq 1 ]; then
              echo "  FAILED: $f"
              failed=1
            fi
          done
          exit $failed

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Go dependencies
        run: go mod download

      - name: Integration tests
        run: go test -tags=integration -race -timeout 5m ./tests/integration/...

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The conformance suite is npx-run and requires Node 22+
      # (fs.globSync); the test skips without it rather than failing.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Go dependencies
        run: go mod download

      - name: MCP conformance suite
        run: go test -tags=integration -race -timeout 10m -run TestConformance ./tests/integration/...

  podman-integration:
    # Pinned to a specific Ubuntu major rather than ubuntu-latest so a future
    # label rollover cannot silently change the container stack under these
    # tests. Note this does NOT pin the image release: the ubuntu-24.04 label
    # serves whatever build is current, so image drift within the major still
    # reaches this job (see #1092).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman netavark aardvark-dns
          # Do NOT force the archive Podman ahead of a newer preinstalled one.
          # That was tried and reverted: on images shipping Podman 5.x, pointing
          # PATH at the archive's 4.9.3 breaks container startup outright
          # (conmon failures across every container test), which is far worse
          # than the single rootless-DNS failure it was meant to address. The
          # real mismatch is the other way round — Podman 5.x against the
          # archive's netavark/aardvark-dns 1.4.0, which is too old — and fixing
          # it needs a newer netavark from outside the Ubuntu archive (#1092).
          # Print the resolved set so a future mismatch is diagnosable from the
          # log alone rather than by bisecting runner images.
          echo "podman:       $(command -v podman) — $(podman --version)"
          echo "netavark:     $(dpkg-query -W -f='${Version}' netavark 2>/dev/null || echo absent)"
          echo "aardvark-dns: $(dpkg-query -W -f='${Version}' aardvark-dns 2>/dev/null || echo absent)"

      - name: Start Podman socket
        run: |
          systemctl --user enable --now podman.socket
          podman system service --time=0 &
          sleep 1
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"

      - name: Verify Podman
        run: |
          podman info --format '{{.Version.Version}}'
          podman info --format 'network_backend={{.Host.NetworkBackend}}'

      - name: Install Go dependencies
        run: go mod download

      - name: Integration tests (Podman)
        env:
          GRIDCTL_RUNTIME: podman
        run: go test -tags=integration -race -timeout 5m ./tests/integration/...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Tests with coverage
        run: npx vitest run --coverage
        working-directory: web

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
