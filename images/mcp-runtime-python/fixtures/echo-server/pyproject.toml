[project]
name = "mcp-echo-fixture"
version = "1.0.0"
description = "Stdio MCP echo fixture for the gridctl Python runtime base"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "gridctl" }]

[project.scripts]
mcp-echo-fixture = "mcp_echo_fixture.server:main"

[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
