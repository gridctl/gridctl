# Reviewed inputs for the MCP Python runtime base. Changing a digest is a
# recipe revision and requires tests plus a new image revision.

package: ghcr.io/gridctl/mcp-runtime-python

python:
  minor: "3.12"
  series: "3.12.11"
  image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  distribution: debian-bookworm

uv:
  image: ghcr.io/astral-sh/uv:0.8.14@sha256:f3660c56d5b08d6c516360981bedc439f499b9bf37f46a216018da3777a74011

identity:
  uid: 10001
  gid: 10001
  name: gridctl

init:
  name: tini
  path: /usr/bin/tini
  args: ["--"]

paths:
  app: /app
  data: /data
  home: /tmp
  cache: /tmp/cache
  config: /tmp/config

bytecode: PYTHONDONTWRITEBYTECODE=1

tags:
  revision: '^sha-[0-9a-f]{40}$'
  candidate: '^candidate-sha-[0-9a-f]{40}$'
  supported_aliases:
    - "3.12"
    - "3.12-bookworm"

maintenance:
  owner: repository maintainers
  python_window: Python 3.12 on Debian Bookworm until upstream Python 3.12 or Debian Bookworm security support ends
  scan_cadence: weekly
  rebuild_cadence: on Critical base findings, and at least monthly
  vulnerability_gate: critical
